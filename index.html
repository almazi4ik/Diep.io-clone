<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slither.io — Полная копия</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu-overlay" id="menuOverlay">
    <div class="menu-card">
        <h1>🐍 SLITHER.IO</h1>
        <input type="text" id="nicknameInput" placeholder="Введите ник..." maxlength="16" autocomplete="off">
        <br>
        <button id="startBtn">▶ СТАРТ</button>
        <div class="menu-hint">🖱️ Мышь — направление движения | 💎 Ешь точки чтобы расти</div>
    </div>
</div>

<div class="game-ui" id="playerNameDisplay">🐍 Загрузка...</div>
<div class="score-board" id="scoreDisplay">📏 ДЛИНА: 10</div>
<div class="leaderboard" id="leaderboard">
    <h3>🏆 ТОП ЗМЕЕК</h3>
    <ol id="leaderList"></ol>
</div>
<div class="controls-hint">🐭 Мышь — направление | 🗺️ Радар внизу справа</div>

<canvas id="gameCanvas"></canvas>

<script src="game.js"></script>
</body>
</html>
